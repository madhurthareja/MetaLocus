# Locus default config. Loaded by src/locus/config.py, overridable by env vars
# (LOCUS_<SECTION>__<KEY>, e.g. LOCUS_HAZARD__TTC_THRESHOLD_SECONDS=1.5).

device: auto  

perception:
  max_concepts: 6
  concept_dwell_seconds: 5.0
  proposer_interval_seconds: 1.5

memory:
  node_decay_half_life_seconds: 8.0
  node_eviction_seconds: 20.0
  edge_radius_m: 4.0
  reacquire_bearing_tolerance_rad: 0.35

kinematics:
  walking_speed_mps: 1.4

hazard:
  ttc_threshold_seconds: 2.0

image:
  width: 640
  height: 480

tts:
  backend: seamless_m4t_v2
  model_id: facebook/seamless-m4t-v2-large
  lang: eng

paths:
  dataset_dir: /home/iairo-dgx1/vision_datasets/hackathon/aea
  dataset_manifest: /home/iairo-dgx1/vision_datasets/hackathon/aea/selected_sequences.json
  sam3_repo: /home/iairo-dgx1/vision_datasets/hackathon/repos/sam3
  sam31_checkpoint_hf_repo: facebook/sam3.1
  sanpo_cache_dir: /home/iairo-dgx1/vision_datasets/hackathon/sanpo_cache

aea_sequences:
  - loc5_script4_seq6_rec1
  - loc4_script1_seq1_rec1
  - loc3_script5_seq6_rec1
  - loc2_script2_seq4_rec2
  - loc1_script3_seq1_rec1
  - loc3_script5_seq3_rec1
  - loc3_script4_seq7_rec1
  - loc3_script3_seq1_rec1

# Verified by hand: ego_motion WALKING, moderate traffic, medium obstacles,
# sunny/high visibility, 539 frames @ 15fps. Dense depth (~96% valid pixels),
# vs. AEA's ~18% from semi-dense point-cloud projection -- this is why SANPO
# was added alongside AEA, not instead of it.
#
# SANPO's public GCS bucket (gs://gresearch/sanpo_dataset/v0/sanpo-real/) has
# 75 real sessions, not just this one -- checked by listing it directly, not
# assumed. Two more added below, picked by querying each candidate's own
# description.json (not guessed): both WALKING, HIGH visibility, 400+ frames,
# and -- the actual reason for picking these two specifically -- real
# vehicular traffic at an urban road junction, which is what actually
# produces genuine closing-hazard events instead of a quiet park walk.
sanpo_sequences:
  - "-5OCPnbrwJdu3jH70ieU7pUiFsOJQoeG"
  # URBAN + ROAD_JUNCTION, vehicular_traffic=HEAVY, human_traffic=LOW, 402 frames.
  - "11tnj2tdX_ElmqXEv6kwSXI34_ZWXv-N"
  # URBAN + ROAD_JUNCTION, vehicular_traffic=MODERATE, human_traffic=MODERATE,
  # num_obstacles=HIGH, 436 frames.
  - "2dVxdA3XmypOsgSWv27dtf3GxjGUkB5A"
