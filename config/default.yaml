# Locus default config. Loaded by src/locus/config.py, overridable by env vars
# (LOCUS_<SECTION>__<KEY>, e.g. LOCUS_HAZARD__TTC_THRESHOLD_SECONDS=1.5).

device: auto  

perception:
  max_concepts: 6
  concept_dwell_seconds: 5.0
  proposer_interval_seconds: 1.5

memory:
  node_decay_half_life_seconds: 8.0
  node_eviction_seconds: 20.0
  edge_radius_m: 4.0
  reacquire_bearing_tolerance_rad: 0.35

kinematics:
  walking_speed_mps: 1.4

hazard:
  ttc_threshold_seconds: 2.0

image:
  width: 640
  height: 480

tts:
  backend: seamless_m4t_v2
  model_id: facebook/seamless-m4t-v2-large
  lang: eng

paths:
  dataset_dir: /home/iairo-dgx1/vision_datasets/hackathon/aea
  dataset_manifest: /home/iairo-dgx1/vision_datasets/hackathon/aea/selected_sequences.json
  sam3_repo: /home/iairo-dgx1/vision_datasets/hackathon/repos/sam3
  sam31_checkpoint_hf_repo: facebook/sam3.1
  sanpo_cache_dir: /home/iairo-dgx1/vision_datasets/hackathon/sanpo_cache

aea_sequences:
  - loc5_script4_seq6_rec1
  - loc4_script1_seq1_rec1
  - loc3_script5_seq6_rec1
  - loc2_script2_seq4_rec2
  - loc1_script3_seq1_rec1
  - loc3_script5_seq3_rec1
  - loc3_script4_seq7_rec1
  - loc3_script3_seq1_rec1

# Real SANPO walks (public bucket gs://gresearch/sanpo_dataset/v0/sanpo-real/),
# chosen from each session's description.json: all ego_motion=WALKING, high
# visibility, urban road junctions with real traffic. The comment on each is
# its dashboard session name (dashboard/data/<name>) and scene tags.
sanpo_sequences:
  - "-5OCPnbrwJdu3jH70ieU7pUiFsOJQoeG"  # sanpo_scaffolding_sidewalk_to_crossing -- heavy vehicles, moderate pedestrians, 539 frames (default/primary)
  - "11tnj2tdX_ElmqXEv6kwSXI34_ZWXv-N"  # sanpo_parked_trucks_avenue -- heavy vehicles, few pedestrians, 402 frames
  - "2dVxdA3XmypOsgSWv27dtf3GxjGUkB5A"  # sanpo_downtown_plaza_corner -- moderate traffic, many obstacles, 436 frames
  - "CCOQeLblEBD4ICLpXikheOgdG1ALcZdM"  # sanpo_delivery_trucks_junction -- moderate traffic, many obstacles, 294 frames
  - "5FV83N_oWfy5whlWhbDUX_2uF2_jx1Pd"  # sanpo_plaza_cyclists -- moderate traffic, few obstacles, 234 frames
